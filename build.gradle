plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '1.0.20'
}

version = '0.2.0'
base.archivesName = "clockedin"

// The project lives in OneDrive, whose sync intermittently locks build files while Gradle
// rewrites them ("Failed to clean up stale outputs"), so build output goes outside it.
layout.buildDirectory = file("${System.getenv('LOCALAPPDATA')}/clockedin-build")

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = "21.1.235"

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        clockedin {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
